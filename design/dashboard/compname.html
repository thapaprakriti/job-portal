<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - Company name</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">JobPortal</h1>
                <nav class="flex space-x-8">
                    <a href="#" class="text-gray-700 hover:text-blue-600">Job</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600">Company</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600">Profile</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto mt-8 p-8 bg-white rounded-xl shadow-sm">
        <!-- Content -->
        <div class="mb-10">
            <h2 class="text-2xl font-semibold text-gray-800 mb-3">Your Company Name</h2>
            <p class="text-gray-600 text-base">
                What would you like to give your company name? you can change this later.
            </p>
        </div>

        <!-- Form -->
        <div class="mb-10">
            <label class="block text-lg font-medium text-gray-700 mb-3">Company Name</label>
            <input 
                type="text" 
                placeholder="JobHunt, Microsoft etc." 
                class="w-full px-4 py-4 text-lg border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
        </div>

        <!-- Buttons -->
        <div class="flex space-x-4">
            <button class=" px-4 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-200 text-base">
                Cancel
            </button>
            <button class=" px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition duration-200 text-base">
                Continue
            </button>
        </div>
    </main>
</body>
</html>
