<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>createcomp</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow">
      <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
          <a href="#">
            <div
              class="flex items-center justify-start font-medium hover:font-bold w-40"
            >
              <span>Job</span>
              <span class="text-red-500">Portal</span>
            </div>
          </a>
          <!-- <h1 class="text-2xl font-bold text-gray-900">JobPortal</h1> -->
          <nav class="flex space-x-8">
            <a href="#" class="text-gray-700 hover:text-blue-600">Company</a>
            <a href="#" class="text-gray-700 hover:text-blue-600">Job</a>
            <a href="#" class="text-gray-700 hover:text-blue-600">Profile</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
      <!-- Filter and New Company Button Section -->
      <div class="flex justify-between items-center mb-6">
        <div>
          <input
            type="text" placeholder="filter by name"
            class="px-4 py-2 border border-gray-300 rounded-lg w-64 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
          />
        </div>
        <button
          class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition duration-200"
        >
          New Company
        </button>
      </div>

      <!-- Companies Table -->
      <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
        <table class="min-w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                Logo
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                Name
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                Date
              </th>
              <th
                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
              >
                Action
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <!-- Empty state as shown in image -->
            <tr>
              <td class="px-6 py-8 text-center text-gray-500" colspan="4">
                No companies to display
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
